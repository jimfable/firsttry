name: Clean Up Obsolete Barrierefrei Audit Workflows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/barrierefrei-cleanup-obsolete.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove superseded workflow definitions
        run: |
          set -euo pipefail
          git config user.name "barrierefrei-audit-bot"
          git config user.email "168410842+jimfable@users.noreply.github.com"
          for f in \
            .github/workflows/barrierefrei-harvest-v2.yml \
            .github/workflows/barrierefrei-harvest-final.yml \
            .github/workflows/barrierefrei-harvest-final2.yml \
            .github/workflows/barrierefrei-adversarial-final.yml \
            .github/workflows/barrierefrei-adversarial-v2.yml \
            .github/workflows/barrierefrei-adversarial-v3.yml; do
            if [ -f "$f" ]; then git rm "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Remove superseded Barrierefrei workflow variants [skip ci]"
            git push origin HEAD:main
          fi
      - name: Cancel obsolete waiting or duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'audit-cleanup'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100',headers=h)
          with urllib.request.urlopen(req) as r: runs=json.load(r)['workflow_runs']
          obsolete=('Harvest Exhaustive','Independent Adversarial Barrierefrei Audit','Multi-Engine Verification v2','Fail-Closed Independent Verification v3')
          for run in runs:
              if run.get('status') in {'queued','in_progress','waiting','requested','pending'} and any(x in run.get('name','') for x in obsolete):
                  url=f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
                  rq=urllib.request.Request(url,headers=h,method='POST')
                  try:
                      urllib.request.urlopen(rq).read(); print('cancelled',run['id'],run['name'])
                  except Exception as e: print('cancel failed',run['id'],e)
          PY
