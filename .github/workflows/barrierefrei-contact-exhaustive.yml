name: Exhaustive Audit of Former Contact Cases

on:
  push:
    paths:
      - "audit/contact-queue.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run exhaustive contact-case audit
        run: |
          python audit/exhaustive.py \
            --queue-url https://raw.githubusercontent.com/jimfable/firsttry/main/audit/contact-queue.json \
            --shard ${{ matrix.shard }} --shards 4 \
            --out contact-${{ matrix.shard }}.jsonl
      - run: test -s contact-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: contact-exhaustive-${{ matrix.shard }}
          path: contact-${{ matrix.shard }}.jsonl
          retention-days: 2
          if-no-files-found: error

  combine:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: contact-exhaustive-*
          path: parts
      - name: Combine and require binary decisions
        run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[]
          for p in glob.glob('parts/**/*.jsonl',recursive=True):
              rows += [json.loads(x) for x in pathlib.Path(p).read_text(encoding='utf-8').splitlines() if x.strip()]
          by={int(r['nr']):r for r in rows}; final=[by[n] for n in sorted(by)]
          errors=[]
          if len(final)!=27 or len(rows)!=len(by): errors.append(f'coverage {len(final)} unique/{len(rows)} total')
          for r in final:
              if r.get('verdict') not in {'Aufnehmen','Nicht aufnehmen'}: errors.append(f"#{r['nr']} nonbinary")
              if r.get('confidence') not in {'Sehr hoch','Hoch'}: errors.append(f"#{r['nr']} weak confidence")
              if r.get('verdict')=='Nicht aufnehmen':
                  c=r.get('coverage') or {}
                  if int(c.get('search_attempts',0))<27 or not c.get('archive_attempted') or not c.get('commoncrawl_attempted'): errors.append(f"#{r['nr']} incomplete negative coverage")
          report={'rows':len(final),'verdicts':{v:sum(r['verdict']==v for r in final) for v in ['Aufnehmen','Nicht aufnehmen']},'errors':errors}
          pathlib.Path('contact-exhaustive-results.json').write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('contact-exhaustive-validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors: raise SystemExit(' | '.join(errors))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: contact-exhaustive-all
          path: |
            contact-exhaustive-results.json
            contact-exhaustive-validation.json
          retention-days: 2
          if-no-files-found: error
