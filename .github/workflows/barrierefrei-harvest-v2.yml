name: Harvest Exhaustive Barrierefrei Audit Results

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/barrierefrei-harvest-v2.yml"

permissions:
  actions: read
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for exhaustive run and download validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "33410821728"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, time, urllib.request
          run_id = os.environ['RUN_ID']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'audit-harvester'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          deadline = time.time() + 4*3600
          while True:
              run = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
              print({'status': run.get('status'), 'conclusion': run.get('conclusion')}, flush=True)
              if run.get('status') == 'completed':
                  if run.get('conclusion') != 'success':
                      raise SystemExit(f'Exhaustive run failed: {run.get("conclusion")}')
                  break
              if time.time() > deadline:
                  raise SystemExit('Timed out waiting for exhaustive run')
              time.sleep(30)
          arts = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          matches = [a for a in arts.get('artifacts', []) if a.get('name') == 'barrierefrei-exhaustive-all' and not a.get('expired')]
          if len(matches) != 1:
              raise SystemExit(f'Expected one complete artifact, found {len(matches)}')
          aid = matches[0]['id']
          subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{aid}/zip','--method','GET','--output','artifact.zip'], check=True)
          PY
          rm -rf results/primary .artifact
          mkdir -p results/primary .artifact
          unzip -q artifact.zip -d .artifact
          cp .artifact/barrierefrei-exhaustive-results.json results/primary/
          cp .artifact/barrierefrei-exhaustive-results.jsonl results/primary/
          cp .artifact/barrierefrei-exhaustive-validation.json results/primary/
          python - <<'PY'
          import json, pathlib
          rows=json.loads(pathlib.Path('results/primary/barrierefrei-exhaustive-results.json').read_text())
          val=json.loads(pathlib.Path('results/primary/barrierefrei-exhaustive-validation.json').read_text())
          assert len(rows)==1041
          assert not val.get('validation_errors'), val.get('validation_errors')
          print({'rows':len(rows),'validation':val})
          PY
      - name: Commit validated primary results
        run: |
          set -euo pipefail
          git config user.name "barrierefrei-audit-bot"
          git config user.email "168410842+jimfable@users.noreply.github.com"
          git pull --rebase origin main
          git add results/primary
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Store validated exhaustive Barrierefrei audit results [skip ci]"
            git push origin HEAD:main
          fi
