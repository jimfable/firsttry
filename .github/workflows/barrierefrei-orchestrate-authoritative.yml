name: Orchestrate Authoritative Barrierefrei Audit End-to-End

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/barrierefrei-orchestrate-authoritative.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: barrierefrei-authoritative-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Dispatch fresh primary-v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run barrierefrei-primary-v2.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Wait for a successful primary-v2 run and committed validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'barrierefrei-orchestrator'}
          deadline=time.time()+6*3600
          last=None
          while True:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/barrierefrei-primary-v2.yml/runs?branch=main&per_page=10',headers=h)
              with urllib.request.urlopen(req,timeout=60) as r:runs=json.load(r).get('workflow_runs',[])
              active=[x for x in runs if x.get('event') in {'workflow_dispatch','push'}]
              if active:
                  latest=active[0];last=(latest.get('id'),latest.get('status'),latest.get('conclusion'))
                  print('primary',last,flush=True)
                  if latest.get('status')=='completed':
                      if latest.get('conclusion')!='success':
                          raise SystemExit(f'primary-v2 failed: {last}')
                      break
              if time.time()>deadline:raise SystemExit(f'primary-v2 timeout; last={last}')
              time.sleep(45)
          # Ensure committed files, not only a green job.
          for path in ('results/primary-v2/barrierefrei-primary-v2-results.json','results/primary-v2/barrierefrei-primary-v2-validation.json'):
              for _ in range(20):
                  try:
                      urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?ref=main',headers=h),timeout=60).read();break
                  except Exception:time.sleep(15)
              else:raise SystemExit(f'missing committed primary file: {path}')
          PY
      - name: Dispatch functional-bundle v9 counter-audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run barrierefrei-adversarial-v9.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Wait for successful v9 and committed authoritative validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'barrierefrei-orchestrator'}
          deadline=time.time()+6*3600;last=None
          while True:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/barrierefrei-adversarial-v9.yml/runs?branch=main&per_page=10',headers=h)
              with urllib.request.urlopen(req,timeout=60) as r:runs=json.load(r).get('workflow_runs',[])
              if runs:
                  latest=runs[0];last=(latest.get('id'),latest.get('status'),latest.get('conclusion'));print('v9',last,flush=True)
                  if latest.get('status')=='completed':
                      if latest.get('conclusion')!='success':raise SystemExit(f'v9 failed: {last}')
                      break
              if time.time()>deadline:raise SystemExit(f'v9 timeout; last={last}')
              time.sleep(45)
          for path in ('results/final-v9/barrierefrei-final-results.json','results/final-v9/barrierefrei-final-validation.json'):
              for _ in range(20):
                  try:
                      urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?ref=main',headers=h),timeout=60).read();break
                  except Exception:time.sleep(15)
              else:raise SystemExit(f'missing committed final file: {path}')
          PY
      - name: Dispatch final artifact publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run barrierefrei-publish-final-v9.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Wait for release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS+3600))
          until gh release view barrierefrei-audit-final-v9 --repo "$GITHUB_REPOSITORY" >/tmp/release.txt 2>&1; do
            if (( SECONDS > deadline )); then cat /tmp/release.txt; exit 1; fi
            sleep 30
          done
          gh release view barrierefrei-audit-final-v9 --repo "$GITHUB_REPOSITORY" --json tagName,name,assets,url
