name: Self-Heal Expanded Barrierefrei Audit v4

on:
  workflow_run:
    workflows:
      - "Fresh Exhaustive Barrierefrei Primary Audit v2"
      - "Authoritative Barrierefrei Audit v8 Expanded Retrieval"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-failed:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Redispatch with bounded retries
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];wid=os.environ['WORKFLOW_ID'];name=os.environ['WORKFLOW_NAME']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'barrierefrei-self-heal-v4'}
          with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/runs?per_page=12',headers=h),timeout=60) as response:runs=json.load(response).get('workflow_runs',[])
          failures=[run for run in runs if run.get('conclusion') in {'failure','timed_out','cancelled'}]
          if len(failures)>4:raise SystemExit(f'{name}: retry limit reached ({len(failures)})')
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/dispatches',data=json.dumps({'ref':'main'}).encode(),headers={**h,'Content-Type':'application/json'},method='POST')
          urllib.request.urlopen(request,timeout=60).read();print(f'redispatched {name}; failures={len(failures)}')
          PY
