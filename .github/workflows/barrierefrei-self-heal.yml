name: Self-Heal Authoritative Barrierefrei Audit

on:
  workflow_run:
    workflows:
      - "Fresh Exhaustive Barrierefrei Primary Audit v2"
      - "Authoritative Barrierefrei Audit v5 with Domain Discovery"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-failed:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry at most three recent failed attempts
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; wid=os.environ['WORKFLOW_ID']; name=os.environ['WORKFLOW_NAME']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'barrierefrei-self-heal'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/runs?per_page=10',headers=h)
          with urllib.request.urlopen(req,timeout=60) as r: runs=json.load(r).get('workflow_runs',[])
          failed=[x for x in runs if x.get('conclusion') in {'failure','timed_out','cancelled'}]
          if len(failed)>3:
              raise SystemExit(f'{name}: refusing endless retries after {len(failed)} recent failures')
          body=json.dumps({'ref':'main'}).encode()
          rq=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/{wid}/dispatches',data=body,headers={**h,'Content-Type':'application/json'},method='POST')
          urllib.request.urlopen(rq,timeout=60).read()
          print(f'redispatched {name}; recent failures={len(failed)}')
          PY
