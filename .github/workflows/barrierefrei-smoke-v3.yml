name: Strict Barrierefrei Audit Regression Suite

on:
  push:
    paths:
      - "audit/exhaustive_v3.py"
      - "audit/smoke-v3-queue.json"
      - ".github/workflows/barrierefrei-smoke-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax check strict auditor
        run: python -m py_compile audit/exhaustive.py audit/exhaustive_v3.py
      - name: Run 25 positive and negative controls
        run: |
          python audit/exhaustive_v3.py \
            --queue-url https://raw.githubusercontent.com/jimfable/firsttry/main/audit/smoke-v3-queue.json \
            --shard 0 --shards 1 --out smoke-v3.jsonl
      - name: Validate all controls and evidence hygiene
        run: |
          python - <<'PY'
          import json, pathlib, urllib.parse
          expected_rows=json.loads(pathlib.Path('audit/smoke-v3-queue.json').read_text(encoding='utf-8'))
          expected={int(x['nr']):x['expected'] for x in expected_rows}
          rows=[json.loads(x) for x in pathlib.Path('smoke-v3.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by={int(r['nr']):r for r in rows}
          errors=[]
          if len(rows)!=len(expected) or len(by)!=len(expected):
              errors.append(f'coverage {len(rows)}/{len(by)} expected {len(expected)}')
          bad_hosts={'northdata.de','companyhouse.de','firmenwissen.de','dnb.com','stadtquartier-tiefesfeld.de','creutz-dachtech.de'}
          digital_parts=('barrierefreiheitserklaerung','barrierefreiheitserklärung','digitale-barrierefreiheit','accessibility-statement','/bfsg','/bitv','/wcag')
          for nr,want in expected.items():
              row=by.get(nr)
              if not row:
                  errors.append(f'#{nr} missing')
                  continue
              if row.get('verdict')!=want:
                  errors.append(f'#{nr}: expected {want}, got {row.get("verdict")} source={row.get("source_url")}')
              if row.get('confidence') not in {'Hoch','Sehr hoch'}:
                  errors.append(f'#{nr}: invalid confidence {row.get("confidence")}')
              source=(row.get('source_url') or '').lower()
              source_host=urllib.parse.urlsplit(source).netloc.lower().removeprefix('www.')
              if want=='Aufnehmen':
                  if not row.get('positive_evidence'):
                      errors.append(f'#{nr}: positive lacks evidence')
                  if source_host in bad_hosts:
                      errors.append(f'#{nr}: positive source is untrusted identity domain {source_host}')
                  if any(part in source for part in digital_parts):
                      errors.append(f'#{nr}: digital-accessibility page used as physical evidence')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          if errors:
              raise SystemExit('REGRESSION FAILURES: '+' | '.join(errors))
          print(f'PASS: {len(rows)} controls')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strict-audit-regression-results
          path: smoke-v3.jsonl
          retention-days: 3
