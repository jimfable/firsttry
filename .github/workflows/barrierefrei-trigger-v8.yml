name: Ensure Expanded v8 Audit Starts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/barrierefrei-trigger-v8.yml"

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: Wait for validated primary-v2 and dispatch v8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'v8-trigger'}
          base=f'https://api.github.com/repos/{repo}/contents/results/primary-v2'
          deadline=time.time()+4*3600
          while True:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/barrierefrei-primary-v2-results.json',headers=h),timeout=60) as r: result_meta=json.load(r)
                  with urllib.request.urlopen(urllib.request.Request(base+'/barrierefrei-primary-v2-validation.json',headers=h),timeout=60) as r: validation_meta=json.load(r)
                  if result_meta.get('size',0)>0 and validation_meta.get('size',0)>0: break
              except Exception: pass
              if time.time()>deadline: raise SystemExit('primary-v2 did not become available')
              time.sleep(45)
          body=json.dumps({'ref':'main'}).encode()
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/barrierefrei-adversarial-v8.yml/dispatches',data=body,headers={**h,'Content-Type':'application/json'},method='POST')
          urllib.request.urlopen(request,timeout=60).read();print('dispatched expanded v8')
          PY
